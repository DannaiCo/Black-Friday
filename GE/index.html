<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Cuenta regresiva Black Friday - iCo Medios</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet" />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #061da5;
      }
      /* Lienzo DOOH: 2304 x 769 px. Sin escalado global. */
      #pantalla {
        position: absolute;
        width: 1793px;
        height: 2051px;
        left: 0;
        top: 0;
        transform-origin: top left;
        overflow: hidden;
        background: url("./fondo.png") center center / 100% 100% no-repeat;
      }
      /* Área original del contador sobre el recuadro azul del fondo. */
      #area-contador {
        position: absolute;
        left: 431px;
        top: 1582px;
        width: 924px;
        height: 289px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      #contador {
        --tam-numero: 250px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: calc(var(--tam-numero) * 0.4);
        width: max-content;
        max-width: none;
        white-space: nowrap;
        font-family: "Bebas Neue", Impact, sans-serif;
        font-weight: 400;
        font-style: normal;
        font-variant-numeric: tabular-nums;
        font-feature-settings: "tnum";
        color: #fff;
      }
      #separador-vertical {
        width: calc(var(--tam-numero) * 0.07);
        height: calc(var(--tam-numero) * 2.1);
        background-color: #ffffff;
        flex-shrink: 0;
      }
      #dias-grupo {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-width: 0;
      }
      #dias {
        font-size: calc(var(--tam-numero) * 2.06);
        line-height: 0.77;
      }
      #dias-etiqueta {
        margin-top: calc(var(--tam-numero) * 0.06);
        font-size: calc(var(--tam-numero) * 0.7);
        line-height: 1;
        letter-spacing: 0.035em;
      }
      #tiempo {
        font-size: calc(var(--tam-numero) * 2);
        line-height: 1;
        letter-spacing: 0.012em;
      }
    </style>
  </head>
  <body>
    <main id="pantalla" aria-label="Cuenta regresiva Black Friday">
      <div id="area-contador">
        <div id="contador" role="timer" aria-label="Tiempo restante para Black Friday">
          <div id="dias-grupo">
            <span id="dias">00</span>
            <span id="dias-etiqueta">DÍAS</span>
          </div>
          <div id="separador-vertical" aria-hidden="true"></div>
          <span id="tiempo">00:00:00</span>
        </div>
      </div>
    </main>
    <script>
      "use strict";
      // 27 de noviembre de 2026, 00:01 a. m., hora de Colombia (UTC-05:00).
      const fechaFinal = Date.parse("2026-11-27T00:01:00-05:00");
      const area = document.getElementById("area-contador");
      const contador = document.getElementById("contador");
      const diasElemento = document.getElementById("dias");
      const tiempoElemento = document.getElementById("tiempo");
      const dosDigitos = (numero) => String(numero).padStart(2, "0");

      function ajustarFuente() {
        // Solo cambia tamaños de texto; no altera el fondo, el lienzo ni el área del contador.
        let minimo = 12;
        let maximo = 250;
        while (maximo - minimo > 0.25) {
          const medio = (minimo + maximo) / 2;
          contador.style.setProperty("--tam-numero", medio + "px");
          const ancho = contador.getBoundingClientRect().width;
          const alto = contador.getBoundingClientRect().height;
          if (ancho <= area.clientWidth - 14 && alto <= area.clientHeight - 16) minimo = medio;
          else maximo = medio;
        }
        contador.style.setProperty("--tam-numero", minimo + "px");
      }

      function actualizarContador() {
        const restante = Math.max(0, Math.ceil((fechaFinal - Date.now()) / 1000));
        const dias = Math.floor(restante / 86400);
        const horas = Math.floor((restante % 86400) / 3600);
        const minutos = Math.floor((restante % 3600) / 60);
        const segundos = restante % 60;
        const textoDias = dosDigitos(dias);
        const textoTiempo = [horas, minutos, segundos].map(dosDigitos).join(":");
        if (diasElemento.textContent !== textoDias) {
          diasElemento.textContent = textoDias;
          ajustarFuente();
        }
        if (tiempoElemento.textContent !== textoTiempo) tiempoElemento.textContent = textoTiempo;
        contador.setAttribute(
          "aria-label",
          `${dias} días, ${horas} horas, ${minutos} minutos y ${segundos} segundos restantes`
        );
      }

      actualizarContador();
      ajustarFuente();
      setInterval(actualizarContador, 250);
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(ajustarFuente);
      window.addEventListener("resize", ajustarFuente);
    </script>
    <script>
      function aplicarModoLlenar() {
        const anchoDiseno = 1793;
        const altoDiseno = 2051;

        const anchoPantalla = window.innerWidth;
        const altoPantalla = window.innerHeight;

        const escalaX = anchoPantalla / anchoDiseno;
        const escalaY = altoPantalla / altoDiseno;

        const lienzo = document.getElementById("lienzo-dooh");

        if (!lienzo) return;

        lienzo.style.transform = `scale(${escalaX}, ${escalaY})`;
      }

      window.addEventListener("DOMContentLoaded", aplicarModoLlenar);
      window.addEventListener("resize", aplicarModoLlenar);
    </script>
  </body>
</html>
